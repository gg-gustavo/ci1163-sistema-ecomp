<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema Ecomp</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; min-height: 100vh; }
    nav { width: 220px; background: #1d3557; color: #fff; padding: 1.5rem 1rem; }
    nav h1 { font-size: 1.1rem; margin: 0 0 1rem; }
    nav a { display: block; color: #a8dadc; text-decoration: none; padding: .45rem .6rem; border-radius: 6px; }
    nav a:hover { background: #457b9d; color: #fff; }
    main { flex: 1; padding: 2rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: .5rem .7rem; text-align: left; }
    th { background: #f1faee; }
    .btn { background: #457b9d; color: #fff; border: 0; padding: .5rem 1rem; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
    .flash { padding: .7rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .flash.success { background: #e6f4ea; color: #1e7e34; }
    .flash.error { background: #fdecea; color: #c0392b; }
    label { display: block; margin: .6rem 0 .2rem; font-weight: 600; }
    input, select, textarea { padding: .4rem; width: 100%; max-width: 420px; box-sizing: border-box; }
    form { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <nav>
    <h1>Sistema Ecomp</h1>
    <a href="{{ url_for('home') }}">Início</a>
    <a href="{{ url_for('projetos.index') }}">Projetos</a>
    <a href="{{ url_for('atividades.index') }}">Atividades</a>
    <a href="{{ url_for('fiscal.index') }}">Notas e Recibos</a>
    <a href="{{ url_for('membros.index') }}">Membros</a>
    <a href="{{ url_for('relatorios.index') }}">Relatórios</a>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
