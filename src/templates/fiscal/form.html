{% extends "base.html" %}
{% block content %}
<h2>Novo item fiscal</h2>

<form method="post" action="{{ url_for('fiscal.nova') }}">
  <label for="projeto_id">Projeto *</label>
  <select id="projeto_id" name="projeto_id" required>
    <option value="">Selecione...</option>
    {% for projeto in projetos %}
    <option value="{{ projeto.id }}" {% if dados.projeto_id == projeto.id|string %}selected{% endif %}>
      #{{ projeto.id }} — {{ projeto.descricao or 'sem descrição' }}
    </option>
    {% endfor %}
  </select>
  {% if not projetos %}<p>Nenhum projeto cadastrado.</p>{% endif %}

  <label for="tipo">Tipo *</label>
  <select id="tipo" name="tipo" required>
    <option value="">Selecione...</option>
    <option value="nota" {% if dados.tipo == 'nota' %}selected{% endif %}>Nota fiscal</option>
    <option value="recibo" {% if dados.tipo == 'recibo' %}selected{% endif %}>Recibo</option>
  </select>

  <label for="data">Data *</label>
  <input id="data" name="data" type="date" value="{{ dados.data or '' }}" required>

  <label for="valor">Valor (R$) *</label>
  <input id="valor" name="valor" type="number" step="0.01" min="0.01" value="{{ dados.valor or '' }}" required>

  <p><button class="btn" type="submit">Cadastrar</button>
     <a class="btn" href="{{ url_for('fiscal.index') }}">Cancelar</a></p>
</form>
{% endblock %}
